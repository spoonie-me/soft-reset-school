<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="'DM Sans', Inter, system-ui, sans-serif">
  <title id="t">What a POTS heart rate looks like when you stand up</title>
  <desc id="d">Illustration, not real data. Heart rate sits near 60 beats per minute while lying down, then jumps to about 120 within seconds of standing and stays high. A dashed line at 90 shows the average, which hides the jump.</desc>
  <rect width="800" height="380" rx="12" fill="#211C17"/>
  <rect x="0.5" y="0.5" width="799" height="379" rx="12" fill="none" stroke="#463D30"/>

  <text x="40" y="44" fill="#EDE6DB" font-size="21" font-weight="700">What a POTS heart rate does when you stand up</text>
  <text x="40" y="68" fill="#B8AD9C" font-size="14">Same person, same minute. Average it and the signal disappears.</text>

  <g stroke="#463D30" stroke-width="1" opacity="0.7">
    <line x1="80" y1="258" x2="740" y2="258"/>
    <line x1="80" y1="132" x2="740" y2="132"/>
  </g>
  <line x1="80" y1="300" x2="740" y2="300" stroke="#A0968A" stroke-width="1"/>
  <g fill="#B8AD9C" font-size="12" text-anchor="end">
    <text x="72" y="262">60</text>
    <text x="72" y="136">120</text>
    <text x="72" y="304">bpm</text>
  </g>

  <line x1="300" y1="92" x2="300" y2="300" stroke="#A0968A" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="308" y="106" fill="#B8AD9C" font-size="13">Stand up</text>

  <line x1="80" y1="195" x2="740" y2="195" stroke="#A0968A" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="740" y="187" fill="#B8AD9C" font-size="13" text-anchor="end">The average, about 90. Looks calm.</text>

  <path d="M80,258 L140,256 L200,259 L260,257 L300,258 L322,214 L345,150 L368,128 L400,137 L432,126 L470,135 L510,128 L560,139 L600,130 L650,137 L700,131 L740,134"
        fill="none" stroke="#d95926" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="300" cy="258" r="4.5" fill="#d95926" stroke="#211C17" stroke-width="2"/>

  <text x="90" y="284" fill="#EDE6DB" font-size="14" font-weight="600">Lying down, about 60</text>
  <text x="740" y="116" fill="#EDE6DB" font-size="14" font-weight="600" text-anchor="end">Standing, about 120</text>
  <text x="40" y="350" fill="#A0968A" font-size="12">Illustration of the pattern. Not real data.</text>
</svg>
