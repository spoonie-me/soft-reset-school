# Applies Prisma migrations and the idempotent seed to the production database.
#
# This used to run inside the Vercel production build (vercel.json). When Neon
# was unreachable from the build, three production deploys in a row failed and
# unrelated fixes never shipped. The database step now runs here, so a database
# problem fails this job and leaves the site deploy alone.
#
# Needs the repository secret DATABASE_URL: the direct (non-pooled) Neon
# connection string, which is what `prisma migrate` expects.
name: DB migrate

on:
  push:
    branches: [main]
    paths:
      - 'backend/prisma/**'
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations at once, and never cancel one halfway.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate deploy + seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Migrate and seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:deploy
