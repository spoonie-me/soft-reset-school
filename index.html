    <!-- Structured data: FAQ (rich result eligibility) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Soft Reset School a real school?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — but a slow one, on purpose. Four career tracks (AI-assisted software development, AI automation consulting, AI-augmented medical coding, digital accessibility QA), packaged into 15-minute lessons you can do horizontally on a bad day. No live sessions, no streak penalties, no good day required."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Soft Reset School for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Anyone going back to work at a pace they can sustain: after illness (physical or mental), burnout, caring for someone, or a career break. Also career-rebuilders, late starters, and anyone who finds traditional retraining incompatible with variable energy."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Soft Reset School cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lesson 1 of every track is a free trial, no card required. The full track is €99 once (2 tracks €149, 3 tracks €199) and includes every lesson, the certification exam and a permanent, publicly verifiable certificate. There is no subscription and nothing renews. If you can't afford €99, ask for a hardship code at hi@softreset.school. No reason needed."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to know how to code already?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The career tracks teach judgment and review skills on top of accessible fundamentals, and lesson 1 of every track is a free trial. If you can read English and use a browser, you can start."
          }
        },
        {
          "@type": "Question",
          "name": "Will the certificate get me hired?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Soft Reset School credentials document a passed certification exam and carry a public verification code any employer can check in seconds. They are not a regulated qualification or licence. What gets people hired is the work you ship while learning — and the exercises are structured so you build a real portfolio, not just multiple-choice answers."
          }
        },
        {
          "@type": "Question",
          "name": "Is the AI feedback actually useful, or just a gimmick?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open-ended exercises get reviewed by Claude (Anthropic's model) with rubrics we wrote. It's automated, so it's instant, but it's not magic — it tells you what's missing, what's wrong, and what to try next. There is no human code review; feedback is fully automated."
          }
        }
      ]
    }
    </script>

    <!-- Analytics (optional). Both are off until their IDs are set at build time:
         VITE_GA_MEASUREMENT_ID (Google Analytics 4, "G-...") and
         VITE_UMAMI_WEBSITE_ID (Umami website UUID). Vercel Web Analytics is
         separate and always on (see src/main.tsx). window.trackEvent and
         window.gtag always exist so callers never need to check. -->
    <script>
      (function () {
        var ga = '%VITE_GA_MEASUREMENT_ID%';
        var umami = '%VITE_UMAMI_WEBSITE_ID%';
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        var gaOn = /^G-[A-Z0-9]+$/.test(ga);
        window.trackEvent = function (name, params) {
          if (gaOn) gtag('event', name, params || {});
        };
        if (gaOn) {
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=' + ga;
          document.head.appendChild(g);
          gtag('js', new Date());
          gtag('config', ga, { anonymize_ip: true, cookie_flags: 'SameSite=None;Secure' });
        }
        if (/^[0-9a-f-]{36}$/i.test(umami)) {
          var u = document.createElement('script');
          u.async = true;
          u.defer = true;
          u.src = 'https://analytics.umami.is/script.js';
          u.setAttribute('data-website-id', umami);
          document.head.appendChild(u);
        }
      })();
    </script>
